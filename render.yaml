services:
  - type: web
    name: smartmeds-backend
    env: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn wsgi:app"
    envVars:
      - key: APP_ENV
        value: "production"
      - key: FLASK_ENV
        value: "production"
      - key: ENABLE_SCHEDULER
        value: "true"
      # The FIREBASE_CREDENTIALS_JSON environment variable should be set manually
      # in the Render Dashboard -> Web Service -> Environment Variables.
      # Paste the full contents of serviceAccountKey.json as the value.
